# =============================================
#  Laboratorio Bacterium — Configuracion
# =============================================

server.port=8081
server.servlet.context-path=/

# =============================================
#  Base de datos — AWS RDS PostgreSQL (PROD)
# =============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:laboratorio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================
#  JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================
#  JWT — generar con: openssl rand -base64 64
# =============================================
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-en-produccion-minimo-64-chars-00000000000000}
app.jwt.expiration-ms=86400000

# =============================================
#  Datos del Laboratorio (para el PDF)
# =============================================
lab.nombre=LABORATORIO CLINICO BACTERIUM
lab.direccion=Colonia X, Ciudad, El Salvador
lab.telefono=2222-0000
lab.email=info@bacterium.com
lab.web=www.bacterium.com
lab.desde=Desde 1987
lab.director=Director Tecnico
lab.cedula=

# =============================================
#  Uploads (logo del laboratorio)
# =============================================
app.upload.dir=uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =============================================
#  Logging
# =============================================
logging.level.com.bacterium=INFO
logging.level.org.springframework.security=WARN
logging.file.name=logs/bacterium.log

# Perfil activo por defecto: dev (cambiar a prod en AWS)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
