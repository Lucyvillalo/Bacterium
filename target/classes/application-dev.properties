# =============================================
#  Perfil DEV — H2 en memoria (sin AWS)
#  Ejecutar: java -jar app.jar --spring.profiles.active=dev
#   o con Maven: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# =============================================

spring.datasource.url=jdbc:h2:mem:bacterium_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

app.jwt.secret=dev-secret-key-solo-para-local-no-usar-en-produccion-1234567890abcdef-extra-padding-here

logging.level.com.bacterium=DEBUG
